{% extends "base.html" %}

{% block content %}
<main class="main">
    <div class="container mt-5">
        <h2>Добавить книгу</h2>
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="title" class="form-label">Название</label>
                <input type="text" class="form-control" id="title" name="title" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Описание</label>
                <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label for="year" class="form-label">Год</label>
                <input type="number" class="form-control" id="year" name="year" required>
            </div>
            <div class="mb-3">
                <label for="publisher" class="form-label">Издатель</label>
                <input type="text" class="form-control" id="publisher" name="publisher" required>
            </div>
            <div class="mb-3">
                <label for="author" class="form-label">Автор</label>
                <input type="text" class="form-control" id="author" name="author" required>
            </div>
            <div class="mb-3">
                <label for="page_count" class="form-label">Количество страниц</label>
                <input type="number" class="form-control" id="page_count" name="page_count" required>
            </div>
            <div class="mb-3">
                <label for="cover" class="form-label">Обложка</label>
                <input type="file" class="form-control" id="cover" name="cover" required>
            </div>
            <button type="submit" class="btn btn-primary">Добавить книгу</button>
        </form>
    </div>
</main>
{% endblock %}
